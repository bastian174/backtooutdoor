name: Website Studio renderer tests

on:
  push:
    branches:
      - feat/real-estate-demo-engine
    paths:
      - "website-studio/**"
      - ".github/workflows/website-studio-tests.yml"
  pull_request:
    paths:
      - "website-studio/**"
      - ".github/workflows/website-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-smoke-test:
    name: Renderer smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run renderer smoke tests
        run: node website-studio/test-renderer.mjs
