<html lang="de">

<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">

<title>Immobilien-Showcase | Back to Outdoor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#1E2226;--bg2:#262B30;--line:#3A4047;--text:#F5F1E6;--muted:#D8D2C5;--sand:#D4B8A5;--accent:#E36D27;--on-accent:#132030;--paper:#F5F1E6;--ink:#1E2226}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',sans-serif;font-size:17px;line-height:1.6}
a{color:var(--sand)}
em.s{font-family:'Instrument Serif',serif;font-style:italic;color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.eyebrow{color:var(--sand);font-size:13px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;margin-bottom:20px}
h2{margin:0;font-weight:400;font-size:clamp(38px,5vw,60px);line-height:1.05}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:18px 30px;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
.btn-red{background:var(--accent);color:var(--on-accent)}.btn-red:hover{background:#F08A4B}
.btn-line{border:1px solid #8E949B;color:var(--text);background:transparent}
header.top{max-width:1280px;margin:0 auto;padding:28px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.brand{color:var(--text);text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
.brand span{color:var(--sand)}
header.top nav{display:flex;gap:28px;font-size:15px}
header.top nav a{color:var(--muted);text-decoration:none}
.hero{position:relative;min-height:680px;display:flex;align-items:flex-end;background:linear-gradient(90deg,rgba(20,23,27,.9) 0%,rgba(20,23,27,.6) 45%,rgba(20,23,27,.12) 100%)}
.hero .wrap{position:relative;padding-bottom:72px}
.hero h1{margin:0;font-weight:400;font-size:clamp(52px,8vw,96px);line-height:.98;max-width:900px}
.hero p.lead{margin:24px 0 0;max-width:600px;color:var(--muted)}
.ctas{display:flex;gap:16px;margin-top:40px}
section.block{padding:120px 0}
section.bordered{border-top:1px solid var(--line)}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.card{background:var(--bg2);border:1px solid var(--line);padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:#6A7179}
.card.selected{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prev{width:100%;aspect-ratio:16/9;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
.prev iframe{width:100%;height:100%;border:0}
.badge{position:absolute;top:12px;left:12px;background:rgba(20,23,27,.75);color:var(--paper);font-size:11px;font-weight:700;padding:5px 9px;z-index:1}
.card .info{padding:24px}
.card .name{font-family:'Instrument Serif',serif;font-size:28px;line-height:1.1;margin:0}
.card .use{font-weight:600;margin-top:8px}
